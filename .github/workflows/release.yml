name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CLASH_HOTLINE_PROXY_URL: ${{ secrets.CLASH_HOTLINE_PROXY_URL }}
          CLASH_HOTLINE_PROXY_TOKEN: ${{ secrets.CLASH_HOTLINE_PROXY_TOKEN }}
        run: cargo build --release --target ${{ matrix.target }} -p clash

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../clash-${{ matrix.target }}.tar.gz clash
          cd ../../..
          sha256sum clash-${{ matrix.target }}.tar.gz > clash-${{ matrix.target }}.tar.gz.sha256 2>/dev/null || \
            shasum -a 256 clash-${{ matrix.target }}.tar.gz > clash-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clash-${{ matrix.target }}
          path: |
            clash-${{ matrix.target }}.tar.gz
            clash-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-site:
    runs-on: ubuntu-latest
    environment: clash-site
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: site

      - name: Build site
        run: bun run build:versioned
        working-directory: site

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/_site --project-name=clash-site

  npm-publish:
    name: Publish npm packages
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare platform binaries
        run: |
          bash clash-npm/scripts/prepare-platform.sh aarch64-apple-darwin clash-npm/platforms/darwin-arm64
          bash clash-npm/scripts/prepare-platform.sh x86_64-unknown-linux-musl clash-npm/platforms/linux-x64
          bash clash-npm/scripts/prepare-platform.sh aarch64-unknown-linux-gnu clash-npm/platforms/linux-arm64

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd clash-npm/platforms/darwin-arm64 && npm publish --access public && cd ../../..
          cd clash-npm/platforms/linux-x64 && npm publish --access public && cd ../../..
          cd clash-npm/platforms/linux-arm64 && npm publish --access public && cd ../../..

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd clash-npm && npm publish --access public && cd ..

      - name: Publish Pi extension package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd clash-pi && npm publish --access public && cd ..
